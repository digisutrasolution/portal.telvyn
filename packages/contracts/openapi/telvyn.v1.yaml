        updatedAt: { type: string, format: date-time }
    SipTrunkPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SipTrunk" }
        nextCursor: { type: string, format: uuid, nullable: true, description: "Pass as `cursor` to fetch the next page; null when exhausted." }
    InlineSipCredentialInput:
      type: object
      required: [label, secret]
      description: >-
        A SIP credential to create and attach in the same request. The type is
        forced to SIP_PASSWORD server-side; the secret is written straight to the
        encrypted vault and is never stored on or returned from the trunk.
        Write-only.
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        hint: { type: string, maxLength: 120 }
        secret: { type: string, minLength: 1, maxLength: 4096, description: "Write-only secret material (vaulted immediately)." }
    CreateSipTrunk:
      type: object
      required: [name, carrierId]
      description: >-
        Create-SIP-trunk body (control-plane configuration only). Ownership
        (tenantId) is server-derived — never a client field. `carrierId` must be
        accessible in the caller's scope. Endpoint values are validated as
        attacker-controlled input. Attach a credential by `credentialId` OR inline
        `credential`, never both.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        carrierId: { type: string, format: uuid, description: "A carrier accessible in the caller's scope (own or system)." }
        direction: { type: string, enum: [INBOUND, OUTBOUND, BIDIRECTIONAL] }
        sipUri: { type: string, maxLength: 512, description: "A sip: or sips: URI (no control characters / whitespace)." }
        host: { type: string, maxLength: 253, description: "Hostname or IPv4/IPv6 (no control characters / whitespace)." }
        port: { type: integer, minimum: 1, maximum: 65535 }
        transport: { type: string, enum: [UDP, TCP, TLS] }
        tls: { type: boolean }
        authMode: { type: string, enum: [IP, CREDENTIALS] }
        allowedIps:
          type: array
          maxItems: 64
          items: { type: string, description: "IPv4/IPv6 address or CIDR." }
        codecs:
          type: array
          maxItems: 32
          items: { type: string, enum: [PCMU, PCMA, G722, G729, OPUS, AMR, AMR_WB] }
        srtp: { type: boolean }
        dtmfMode: { type: string, enum: [rfc2833, info, inband] }
        maxCps: { type: integer, minimum: 0, maximum: 1000000 }
        maxConcurrentCalls: { type: integer, minimum: 0, maximum: 10000000 }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        credentialId: { type: string, format: uuid, description: "Attach an existing SIP vault credential." }
        credential: { $ref: "#/components/schemas/InlineSipCredentialInput" }
    UpdateSipTrunk:
      type: object
      description: >-
        Partial SIP-trunk update — only supplied fields change. Ownership/scope
        are never changed from the client. Same credential rules as create
        (`credentialId` or inline `credential`, never both).
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        carrierId: { type: string, format: uuid, description: "A carrier accessible in the caller's scope (own or system)." }
        direction: { type: string, enum: [INBOUND, OUTBOUND, BIDIRECTIONAL] }
        sipUri: { type: string, maxLength: 512 }
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        transport: { type: string, enum: [UDP, TCP, TLS] }
        tls: { type: boolean }
        authMode: { type: string, enum: [IP, CREDENTIALS] }
        allowedIps:
          type: array
          maxItems: 64
          items: { type: string, description: "IPv4/IPv6 address or CIDR." }
        codecs:
          type: array
          maxItems: 32
          items: { type: string, enum: [PCMU, PCMA, G722, G729, OPUS, AMR, AMR_WB] }
        srtp: { type: boolean }
        dtmfMode: { type: string, enum: [rfc2833, info, inband] }
        maxCps: { type: integer, minimum: 0, maximum: 1000000 }
        maxConcurrentCalls: { type: integer, minimum: 0, maximum: 10000000 }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        credentialId: { type: string, format: uuid }
        credential: { $ref: "#/components/schemas/InlineSipCredentialInput" }
    DidHealth:
      type: object
      required: [status, detail]
      description: Honest DID health; UNKNOWN (no live SIP-path check exists), never fabricated.
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        detail: { type: string }
    Did:
      type: object
      required: [id, e164, country, status, carrierId, sipTrunkId, routingProfileId, regionId, assignedAt, health, createdAt, updatedAt]
      description: A DID (phone number). Related resources are carried as reference ids only — never embedded objects.
      properties:
        id: { type: string, format: uuid }
        e164: { type: string, description: "Canonical E.164, e.g. +14155550100." }
        country: { type: string, description: "ISO-3166-1 alpha-2, derived from the number." }
        status: { type: string, enum: [AVAILABLE, RESERVED, ASSIGNED, ACTIVE, SUSPENDED, PORTING, RELEASED], description: "Lifecycle/administrative status (distinct from health)." }
        carrierId: { type: string, format: uuid, nullable: true }
        sipTrunkId: { type: string, format: uuid, nullable: true }
        routingProfileId: { type: string, format: uuid, nullable: true }
        regionId: { type: string, format: uuid, nullable: true }
        assignedAt: { type: string, format: date-time, nullable: true }
        health: { $ref: "#/components/schemas/DidHealth" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DidPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Did" }
        nextCursor: { type: string, format: uuid, nullable: true, description: "Pass as `cursor` to fetch the next page; null when exhausted." }
    CreateDid:
      type: object
      required: [number]
      description: >-
        Create-DID body (control-plane only). Ownership (tenantId) is
        server-derived. `number` is a raw phone number normalized to canonical
        E.164 server-side; `country` is derived from it and is never a client
        field. Relationship references are optional and validated server-side for
        scope + existence (carrier/trunk consistency enforced).
      properties:
        number: { type: string, minLength: 3, maxLength: 32, description: "Raw phone number; normalized to canonical E.164 server-side." }
        status: { type: string, enum: [AVAILABLE, RESERVED, ASSIGNED, ACTIVE, SUSPENDED, PORTING, RELEASED] }
        carrierId: { type: string, format: uuid }
        sipTrunkId: { type: string, format: uuid }
        routingProfileId: { type: string, format: uuid }
        regionId: { type: string, format: uuid }
    UpdateDid:
      type: object
      description: >-
        Partial DID update. The `number` is immutable and is not a field here.
        Relationship references may be reassigned or detached by sending `null`.
        Unknown keys are rejected server-side.
      properties:
        status: { type: string, enum: [AVAILABLE, RESERVED, ASSIGNED, ACTIVE, SUSPENDED, PORTING, RELEASED] }
        carrierId: { type: string, format: uuid, nullable: true, description: "null detaches the carrier." }
        sipTrunkId: { type: string, format: uuid, nullable: true, description: "null detaches the SIP trunk." }
        routingProfileId: { type: string, format: uuid, nullable: true, description: "null detaches the routing profile." }
        regionId: { type: string, format: uuid, nullable: true, description: "null detaches the region." }
    RoutingPolicy:
      type: object
      required: [selectionStrategy, failoverEnabled, failoverConditions, maxAttempts, overallTimeoutSeconds]
      description: Declarative selection + failover policy for a profile's rules (never executed).
      properties:
        selectionStrategy: { type: string, enum: [PRIORITY, WEIGHTED, ROUND_ROBIN, SIMULTANEOUS] }
        failoverEnabled: { type: boolean }
        failoverConditions:
          type: array
          items: { type: string, enum: [NO_ANSWER, BUSY, FAILED, UNREACHABLE, TIMEOUT] }
        maxAttempts: { type: integer, nullable: true, description: "Bounded attempt cap (loop protection)." }
        overallTimeoutSeconds: { type: integer, nullable: true }
    RoutingRule:
      type: object
      required: [id, destinationType, destination, priority, weight, enabled, timeoutSeconds, retryCount, carrierId, failoverDestination, failoverDestinationType, failoverAfterSeconds, schedule]
      description: A single declarative routing rule. Config only — nothing is dialled.
      properties:
        id: { type: string, format: uuid }
        destinationType: { type: string, enum: [SIP_TRUNK, PHONE_NUMBER, EXTENSION, VOICEMAIL, WEBHOOK] }
        destination: { type: string, description: "Canonical value validated per destinationType (E.164, trunk id, etc.)." }
        priority: { type: integer, description: "Deterministic order, ascending." }
        weight: { type: integer, nullable: true, description: "For the WEIGHTED strategy." }
        enabled: { type: boolean }
        timeoutSeconds: { type: integer, nullable: true }
        retryCount: { type: integer, nullable: true }
        carrierId: { type: string, format: uuid, nullable: true }
        failoverDestination: { type: string, nullable: true }
        failoverDestinationType: { type: string, nullable: true, enum: [SIP_TRUNK, PHONE_NUMBER, EXTENSION, VOICEMAIL, WEBHOOK] }
        failoverAfterSeconds: { type: integer, nullable: true }
        schedule:
          type: object
          nullable: true
          additionalProperties: true
          description: "Optional declarative schedule { timezone, daysOfWeek[], startMinute, endMinute }."
    RoutingProfile:
      type: object
      required: [id, name, direction, description, status, version, policy, rules, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        direction: { type: string, enum: [INBOUND, OUTBOUND] }
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED], description: "Administrative status." }
        version: { type: integer, description: "Optimistic-concurrency version." }
        policy: { $ref: "#/components/schemas/RoutingPolicy" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/RoutingRule" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RoutingProfilePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RoutingProfile" }
        nextCursor: { type: string, format: uuid, nullable: true, description: "Pass as `cursor` to fetch the next page; null when exhausted." }
    RoutingScheduleInput:
      type: object
      required: [timezone, daysOfWeek, startMinute, endMinute]
      description: Optional declarative time-of-day schedule for a rule (never executed). startMinute must be before endMinute.
      properties:
        timezone: { type: string, minLength: 1, maxLength: 64, description: "IANA timezone, validated server-side." }
        daysOfWeek:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: integer, minimum: 0, maximum: 6, description: "0=Sunday … 6=Saturday." }
        startMinute: { type: integer, minimum: 0, maximum: 1439 }
        endMinute: { type: integer, minimum: 0, maximum: 1439 }
    RoutingRuleInput:
      type: object
      required: [destinationType, destination]
      description: >-
        A single declarative routing rule to create (config only — nothing is
        dialled). The destination is validated per type server-side (canonical
        E.164, 1–10-digit extension, an owned SIP trunk id, a simple voicemail
        identifier, or an https webhook to a public host). A typed failover
        destination requires its type; a rule may not fail over to its own
        destination.
      properties:
        destinationType: { type: string, enum: [SIP_TRUNK, PHONE_NUMBER, EXTENSION, VOICEMAIL, WEBHOOK] }
        destination: { type: string, minLength: 1, maxLength: 2048 }
        priority: { type: integer, minimum: 0, maximum: 100000, description: "Deterministic order, ascending." }
        weight: { type: integer, minimum: 1, maximum: 1000, description: "For the WEIGHTED strategy." }
        enabled: { type: boolean }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 600 }
        retryCount: { type: integer, minimum: 0, maximum: 10 }
        carrierId: { type: string, format: uuid, description: "A carrier accessible in the caller's scope." }
        failoverDestination: { type: string, minLength: 1, maxLength: 2048 }
        failoverDestinationType: { type: string, enum: [SIP_TRUNK, PHONE_NUMBER, EXTENSION, VOICEMAIL, WEBHOOK] }
        failoverAfterSeconds: { type: integer, minimum: 1, maximum: 600 }
        schedule: { $ref: "#/components/schemas/RoutingScheduleInput" }
    CreateRoutingProfile:
      type: object
      required: [name]
      description: >-
        Create-routing-profile body. DECLARATIVE CONFIGURATION ONLY. Ownership
        (tenantId) is server-derived. The flat policy fields configure selection +
        failover; `failoverEnabled: true` requires at least one failoverCondition.
        `rules` is optional (omitted = empty rule set).
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        direction: { type: string, enum: [INBOUND, OUTBOUND] }
        description: { type: string, maxLength: 500 }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        selectionStrategy: { type: string, enum: [PRIORITY, WEIGHTED, ROUND_ROBIN, SIMULTANEOUS] }
        failoverEnabled: { type: boolean }
        failoverConditions:
          type: array
          maxItems: 5
          items: { type: string, enum: [NO_ANSWER, BUSY, FAILED, UNREACHABLE, TIMEOUT] }
        maxAttempts: { type: integer, minimum: 1, maximum: 20, description: "Bounded attempt cap (loop protection)." }
        overallTimeoutSeconds: { type: integer, minimum: 1, maximum: 3600 }
        rules:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RoutingRuleInput" }
    UpdateRoutingProfile:
      type: object
      description: >-
        Partial routing-profile update. DECLARATIVE CONFIGURATION ONLY. Only
        supplied fields change; `failoverEnabled: true` still requires at least one
        failoverCondition. If `rules` is present it REPLACES the whole rule set;
        when omitted the existing rules are untouched. `expectedVersion` enables
        optimistic concurrency (mismatch → 409).
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        direction: { type: string, enum: [INBOUND, OUTBOUND] }
        description: { type: string, maxLength: 500, nullable: true, description: "null clears the description." }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        selectionStrategy: { type: string, enum: [PRIORITY, WEIGHTED, ROUND_ROBIN, SIMULTANEOUS] }
        failoverEnabled: { type: boolean }
        failoverConditions:
          type: array
          maxItems: 5
          items: { type: string, enum: [NO_ANSWER, BUSY, FAILED, UNREACHABLE, TIMEOUT] }
        maxAttempts: { type: integer, minimum: 1, maximum: 20 }
        overallTimeoutSeconds: { type: integer, minimum: 1, maximum: 3600 }
        rules:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RoutingRuleInput" }
        expectedVersion: { type: integer, minimum: 0, description: "If set, the update applies only when the profile's current version matches." }
    LcrRoute:
      type: object
      required: [id, carrierId, sipTrunkId, prefix, country, costMicros, currency, priority, weight, enabled, effectiveFrom, effectiveTo]
      description: A single LCR route candidate. Config only — never dialled or rated.
      properties:
        id: { type: string, format: uuid }
        carrierId: { type: string, format: uuid }
        sipTrunkId: { type: string, format: uuid, nullable: true }
        prefix: { type: string, description: "E.164-style destination prefix, e.g. 44, 9198." }
        country: { type: string, nullable: true, description: "ISO-3166-1 alpha-2." }
        costMicros: { type: integer, description: "Millionths of a currency unit (integer, non-negative)." }
        currency: { type: string, enum: [USD, EUR, GBP, INR, AUD, CAD, JPY] }
        priority: { type: integer, description: "Lower number = higher preference." }
        weight: { type: integer, nullable: true, description: "For the WEIGHTED strategy." }
        enabled: { type: boolean }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        effectiveTo: { type: string, format: date-time, nullable: true }
    LcrPolicy:
      type: object
      required: [id, name, description, selectionStrategy, enabled, version, candidates, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        selectionStrategy: { type: string, enum: [LOWEST_COST, HIGHEST_PRIORITY, WEIGHTED, QUALITY_FIRST] }
        enabled: { type: boolean }
        version: { type: integer, description: "Optimistic-concurrency version." }
        candidates:
          type: array
          description: Route candidates in deterministic selection order for the policy's strategy.
          items: { $ref: "#/components/schemas/LcrRoute" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LcrPolicyPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LcrPolicy" }
        nextCursor: { type: string, format: uuid, nullable: true, description: "Pass as `cursor` to fetch the next page; null when exhausted." }
    LcrRouteInput:
      type: object
      required: [carrierId, prefix, costMicros, currency]
      description: >-
        A single LCR route candidate to create (config only — never dialled or
        rated). `carrierId` must be accessible in the caller's scope and any
        `sipTrunkId` must be owned by the tenant. `costMicros` is an INTEGER in
        millionths of a currency unit — never floating point.
      properties:
        carrierId: { type: string, format: uuid }
        sipTrunkId: { type: string, format: uuid }
        prefix: { type: string, pattern: "^\\+?[0-9]{1,15}$", description: "Up to 15 digits, optional leading +." }
        country: { type: string, minLength: 2, maxLength: 2, description: "ISO-3166-1 alpha-2, uppercase." }
        costMicros: { type: integer, minimum: 0, maximum: 1000000000000, description: "Millionths of a currency unit (integer, non-negative)." }
        currency: { type: string, enum: [USD, EUR, GBP, INR, AUD, CAD, JPY] }
        priority: { type: integer, minimum: 0, maximum: 100000, description: "Lower number = higher preference." }
        weight: { type: integer, minimum: 1, maximum: 1000, description: "For the WEIGHTED strategy." }
        enabled: { type: boolean }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, description: "Must be after effectiveFrom." }
    CreateLcrPolicy:
      type: object
      required: [name]
      description: >-
        Create-LCR-policy body. DECLARATIVE ROUTE SELECTION ONLY. Ownership
        (tenantId) is server-derived. `routes` is optional (omitted = empty route
        set).
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        selectionStrategy: { type: string, enum: [LOWEST_COST, HIGHEST_PRIORITY, WEIGHTED, QUALITY_FIRST] }
        enabled: { type: boolean }
        routes:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/LcrRouteInput" }
    UpdateLcrPolicy:
      type: object
      description: >-
        Partial LCR-policy update. DECLARATIVE ROUTE SELECTION ONLY. Only supplied
        fields change. If `routes` is present it REPLACES the whole route set; when
        omitted the existing routes are untouched. `expectedVersion` enables
        optimistic concurrency (mismatch → 409).
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500, nullable: true, description: "null clears the description." }
        selectionStrategy: { type: string, enum: [LOWEST_COST, HIGHEST_PRIORITY, WEIGHTED, QUALITY_FIRST] }
        enabled: { type: boolean }
        routes:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/LcrRouteInput" }
        expectedVersion: { type: integer, minimum: 0, description: "If set, the update applies only when the policy's current version matches." }
