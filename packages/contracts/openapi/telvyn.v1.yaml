openapi: 3.1.0
info:
  title: Telvyn DID Portal API
  version: 0.2.0
  description: >
    Telvyn PROMAX control-plane API. Contract-first: this document is authored
    before implementation; clients are generated from it. Errors are RFC 7807
    application/problem+json. Auth: short-lived Bearer access token; opaque
    rotating refresh token in an httpOnly SameSite=Strict cookie (tv_refresh,
    path=/v1/auth) or request body for non-browser clients.
servers:
  - url: http://localhost:3311
    description: local development
tags:
  - name: auth
  - name: telecom
security:
  - bearerAuth: []
paths:
  /v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Login with email + password (step 1; MFA challenge when enabled)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Tokens issued, or MFA challenge required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "423": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/mfa/verify:
    post:
      tags: [auth]
      security: []
      summary: Complete an MFA-challenged login (step 2)
      operationId: mfaVerify
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaVerifyRequest" }
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Rotate the refresh token; reuse is detected and revokes the session
      operationId: refresh
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: "Only for non-cookie clients" }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session and clear the refresh cookie
      operationId: logout
      responses:
        "204": { description: Logged out }
  /v1/auth/logout-all:
    post:
      tags: [auth]
      summary: Revoke every session of the current user
      operationId: logoutAll
      responses:
        "204": { description: All sessions revoked }
  /v1/auth/me:
    get:
      tags: [auth]
      summary: Current authenticated user
      operationId: me
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me/context:
    get:
      tags: [authz]
      summary: Current authorization context (identity + active tenant + roles + permissions)
      description: >-
        Self-scoped "whoami" for the authenticated session. Returns the
        server-derived tenant context (ADR-0004): the active tenant and its
        type, the membership's roles, and the expanded concrete permission keys.
        No permission is required beyond an authenticated session with an active
        membership — the frontend calls this at bootstrap, before it knows any
        permissions. Never accepts or trusts a client-supplied tenant id.
      operationId: meContext
      responses:
        "200":
          description: Authorization context for the current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeContext" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/members:
    get:
      tags: [authz]
      summary: List members of the current tenant
      description: >-
        The members of the session's own tenant (strictly tenant-scoped — a
        foreign tenant's members are never returned; the tenant id comes from
        the server-derived context, never the client). Each member carries the
        user's identity, the membership status, and the roles assigned to the
        membership in this tenant. Ordered by join time (createdAt ASC). No
        secrets appear. Requires `member.read`.
      operationId: listMembers
      responses:
        "200":
          description: Members of the current tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/auth/sessions:
    get:
      tags: [auth]
      summary: List sessions/devices for the current user
      operationId: listSessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
  /v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Revoke one session (device sign-out)
      operationId: revokeSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/auth/login-history:
    get:
      tags: [auth]
      summary: Recent login attempts for the current user
      operationId: loginHistory
      responses:
        "200":
          description: Attempts, newest first (max 50)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoginAttempt" }
  /v1/auth/security-events:
    get:
      tags: [auth]
      summary: Recent security events for the current user
      operationId: securityEvents
      responses:
        "200":
          description: Events, newest first (max 50)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecurityEvent" }
  /v1/auth/password-reset/request:
    post:
      tags: [auth]
      security: []
      summary: Request a password-reset email (always 202 — no account enumeration)
      operationId: passwordResetRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Accepted (queued if the account exists) }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      security: []
      summary: Set a new password with a reset token; revokes all sessions
      operationId: passwordResetConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Password updated }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/auth/email-verification/request:
    post:
      tags: [auth]
      summary: Send (queue) an email-verification message for the current user
      operationId: emailVerificationRequest
      responses:
        "202": { description: Queued }
  /v1/auth/email-verification/confirm:
    post:
      tags: [auth]
      security: []
      summary: Confirm email ownership with a verification token
      operationId: emailVerificationConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Email verified }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/auth/mfa/enroll:
    post:
      tags: [auth]
      summary: Begin TOTP enrollment (returns otpauth URI; not yet enabled)
      operationId: mfaEnroll
      responses:
        "200":
          description: Enrollment data
          content:
            application/json:
              schema:
                type: object
                required: [otpauthUri]
                properties:
                  otpauthUri: { type: string }
  /v1/auth/mfa/enable:
    post:
      tags: [auth]
      summary: Enable MFA by proving a TOTP code; returns one-time recovery codes
      operationId: mfaEnable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "200":
          description: MFA enabled
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/auth/mfa/disable:
    post:
      tags: [auth]
      summary: Disable MFA (step-up — requires current password AND a valid code)
      operationId: mfaDisable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, description: "TOTP or recovery code" }
      responses:
        "204": { description: MFA disabled }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines:
    get:
      tags: [telecom]
      summary: List telecom engines (platform)
      description: >-
        Platform-scoped list of configured telecom engines with their honest
        health (UNKNOWN for stub adapters — never fabricated). Requires an active
        PLATFORM tenant and `telecom.read`. Read-only.
      operationId: listEngines
      responses:
        "200":
          description: Engines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines/{id}:
    get:
      tags: [telecom]
      summary: Get one telecom engine (platform)
      operationId: getEngine
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Engine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines/{id}/status:
    get:
      tags: [telecom]
      summary: Normalized engine status — health + connection + config version (platform)
      description: >-
        Read-only, SSRF-guarded status with honest health (UNKNOWN for stubs; no
        live egress with the Null connector), connection reachability, and the
        config version posture (desired/applied) plus the live desired-config
        summary. Requires PLATFORM + `telecom.health.read`.
      operationId: getEngineStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Engine status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/regions:
    get:
      tags: [telecom]
      summary: List telecom regions (platform)
      description: Platform-scoped list of regions. Requires PLATFORM + `telecom.read`. Read-only.
      operationId: listRegions
      responses:
        "200":
          description: Regions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Region" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/telecom/nodes:
    get:
      tags: [telecom]
      summary: List telecom nodes with heartbeat health (platform)
      description: >-
        Platform-scoped list of nodes with honest heartbeat health (UNKNOWN until
        a node reports). Requires PLATFORM + `telecom.read`. Read-only.
      operationId: listNodes
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines/{id}/health-check:
    post:
      tags: [telecom]
      summary: Probe engine health (platform)
      description: >-
        Actively probe the engine's health (SSRF-guarded; honest UNKNOWN with the
        Null connector) and record a health event on a transition. Requires
        PLATFORM + `telecom.health.read`.
      operationId: checkEngineHealth
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Health report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineHealthReport" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines/{id}/sync:
    post:
      tags: [telecom]
      summary: Synchronize control-plane config to the engine (platform)
      description: >-
        Versioned, idempotent, concurrency-guarded config sync. With a stub
        adapter this returns a normalized NOT_IMPLEMENTED (501) — no fake success
        and no live connectivity. A concurrent sync is refused (409); a lock
        outage fails closed (503). Requires PLATFORM + `telecom.manage`.
      operationId: syncEngine
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Sync outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncOutcome" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "504": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines/{id}/sync/rollback:
    post:
      tags: [telecom]
      summary: Roll back to the previous desired config version (platform)
      description: Append-only rollback to the prior desired version. 400 when there is no previous version. Requires PLATFORM + `telecom.manage`.
      operationId: rollbackEngine
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Sync outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncOutcome" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/telecom/carriers:
    get:
      tags: [telecom]
      summary: List carriers (tenant + system)
      description: >-
        Carriers visible to the session — the tenant's own plus system
        (platform-owned) carriers; a foreign tenant's carriers are never
        returned. Cursor-paginated. Health is honest (UNKNOWN — no carrier probe
        exists yet, never fabricated). Secrets never appear: a carrier carries
        only a non-secret vault credential reference. Requires `carrier.read`.
      operationId: listCarriers
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid }, description: "nextCursor from a prior page." }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] } }
        - { name: regionId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: scope, in: query, required: false, schema: { type: string, enum: [all, system, tenant], default: all } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 }, description: "Case-insensitive name search." }
      responses:
        "200":
          description: Carriers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarrierPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [telecom]
      summary: Create a carrier
      description: >-
        Create a carrier. Scope (system vs tenant) and ownership are derived
        server-side from the session (never a client field — mass-assignment
        protection). A credential may be attached by referencing an existing
        vault credential (`credentialId`) OR created inline (`credential`, whose
        secret goes straight to the vault), never both; the secret is never
        stored on or returned from the carrier. Requires `carrier.create`.
      operationId: createCarrier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCarrier" }
      responses:
        "201":
          description: Carrier created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Carrier" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/telecom/carriers/{id}:
    get:
      tags: [telecom]
      summary: Get one carrier (tenant + system)
      description: >-
        A single carrier visible to the session — the tenant's own or a system
        (platform-owned) carrier. A foreign tenant's carrier is reported as 404
        (IDOR-safe). Honest UNKNOWN health; secrets never appear (non-secret
        credential reference only). Requires `carrier.read`.
      operationId: getCarrier
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Carrier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Carrier" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [telecom]
      summary: Update a carrier
      description: >-
        Partially update a carrier (only the supplied fields change). Scope and
        ownership are never changed from the client. Credential rules match
        create: `credentialId` or inline `credential`, never both; secrets are
        vaulted and never returned. A foreign tenant's carrier is 404 (IDOR-safe).
        Requires `carrier.update`.
      operationId: updateCarrier
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCarrier" }
      responses:
        "200":
          description: Carrier updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Carrier" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [telecom]
      summary: Delete a carrier (soft delete)
      description: >-
        Soft-delete a carrier (sets deletedAt; the row is retained for audit and
        history). A foreign tenant's carrier is 404 (IDOR-safe). Requires
        `carrier.delete`.
      operationId: deleteCarrier
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Carrier deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/sip-trunks:
    get:
      tags: [telecom]
      summary: List SIP trunks (tenant)
      description: >-
        The tenant's own SIP trunks (strictly tenant-owned — a foreign tenant's
        trunks are never returned). Control-plane configuration only; there is no
        live connectivity, so health is honest UNKNOWN (never fabricated).
        Cursor-paginated. Secrets never appear — a trunk carries only a non-secret
        credential reference and a carrier summary. Requires `sip_trunk.read`.
      operationId: listSipTrunks
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid }, description: "nextCursor from a prior page." }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [INBOUND, OUTBOUND, BIDIRECTIONAL] } }
        - { name: transport, in: query, required: false, schema: { type: string, enum: [UDP, TCP, TLS] } }
        - { name: carrierId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 }, description: "Case-insensitive name search." }
      responses:
        "200":
          description: SIP trunks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SipTrunkPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/telecom/sip-trunks/{id}:
    get:
      tags: [telecom]
      summary: Get one SIP trunk (tenant)
      description: >-
        A single SIP trunk owned by the session's tenant. A foreign tenant's
        trunk is reported as 404 (IDOR-safe). Control-plane configuration only;
        honest UNKNOWN health (no live connectivity). Secrets never appear —
        a non-secret credential reference and a carrier summary only. Requires
        `sip_trunk.read`.
      operationId: getSipTrunk
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: SIP trunk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SipTrunk" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/dids:
    get:
      tags: [telecom]
      summary: List DIDs (tenant)
      description: >-
        The tenant's own DIDs (strictly tenant-owned — the platform inventory
        pool and other tenants' numbers are never returned). Control-plane only;
        health is honest UNKNOWN (no live SIP-path check). Cursor-paginated.
        Responses carry safe reference ids only (no embedded related objects).
        Requires `did.read`.
      operationId: listDids
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid }, description: "nextCursor from a prior page." }
        - { name: status, in: query, required: false, schema: { type: string, enum: [AVAILABLE, RESERVED, ASSIGNED, ACTIVE, SUSPENDED, PORTING, RELEASED] } }
        - { name: carrierId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: sipTrunkId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: routingProfileId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: regionId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: country, in: query, required: false, schema: { type: string, minLength: 2, maxLength: 2 }, description: "ISO-3166-1 alpha-2 (uppercase)." }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 32 }, description: "Substring match against the canonical E.164." }
      responses:
        "200":
          description: DIDs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DidPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/telecom/dids/{id}:
    get:
      tags: [telecom]
      summary: Get one DID (tenant)
      description: >-
        A single DID owned by the session's tenant. A number in the platform
        inventory pool or owned by another tenant is reported as 404 (IDOR-safe).
        Control-plane only; honest UNKNOWN health (no live SIP-path check).
        Related resources are carried as reference ids only — never embedded
        objects. Requires `did.read`.
      operationId: getDid
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: DID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Did" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/routing-profiles:
    get:
      tags: [telecom]
      summary: List routing profiles (tenant)
      description: >-
        The tenant's own routing profiles (strictly tenant-owned). Declarative
        configuration only — nothing is executed (no SIP, webhooks, failover or
        LCR). Each profile carries its policy and its ordered rules (priority
        ASC). Cursor-paginated. Requires `routing.read`.
      operationId: listRoutingProfiles
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid }, description: "nextCursor from a prior page." }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [INBOUND, OUTBOUND] } }
        - { name: strategy, in: query, required: false, schema: { type: string, enum: [PRIORITY, WEIGHTED, ROUND_ROBIN, SIMULTANEOUS] } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 }, description: "Case-insensitive name search." }
      responses:
        "200":
          description: Routing profiles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingProfilePage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/telecom/routing-profiles/{id}:
    get:
      tags: [telecom]
      summary: Get one routing profile (tenant)
      description: >-
        A single routing profile owned by the session's tenant, with its full
        policy and its complete ordered rule set (priority ASC). A foreign
        tenant's profile is reported as 404 (IDOR-safe). Declarative configuration
        only — nothing is executed (no SIP, webhooks, failover or LCR). Requires
        `routing.read`.
      operationId: getRoutingProfile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Routing profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingProfile" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/lcr-policies:
    get:
      tags: [telecom]
      summary: List LCR policies (tenant)
      description: >-
        The tenant's own least-cost-routing policies (strictly tenant-owned).
        Declarative route SELECTION only — nothing is executed, rated or billed.
        Each policy carries its route candidates in deterministic selection order
        for its strategy. `costMicros` is millionths of a currency unit (integer).
        Cursor-paginated. Requires `routing.read` (LCR is part of the routing
        domain).
      operationId: listLcrPolicies
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid }, description: "nextCursor from a prior page." }
        - { name: enabled, in: query, required: false, schema: { type: boolean } }
        - { name: strategy, in: query, required: false, schema: { type: string, enum: [LOWEST_COST, HIGHEST_PRIORITY, WEIGHTED, QUALITY_FIRST] } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 }, description: "Case-insensitive name search." }
      responses:
        "200":
          description: LCR policies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LcrPolicyPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/telecom/lcr-policies/{id}:
    get:
      tags: [telecom]
      summary: Get one LCR policy (tenant)
      description: >-
        A single least-cost-routing policy owned by the session's tenant, with its
        complete set of route candidates in deterministic selection order for the
        policy's strategy. A foreign tenant's policy is reported as 404 (IDOR-safe).
        Declarative route SELECTION only — nothing is executed, rated or billed.
        `costMicros` is millionths of a currency unit (integer). Requires
        `routing.read` (LCR is part of the routing domain).
      operationId: getLcrPolicy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: LCR policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LcrPolicy" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        issues: { type: array, items: { type: object } }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 128 }
    LoginResult:
      oneOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [mfaRequired, mfaToken]
          properties:
            mfaRequired: { type: boolean, const: true }
            mfaToken: { type: string, description: "5-minute single-purpose JWT" }
    MfaVerifyRequest:
      type: object
      required: [mfaToken, code]
      properties:
        mfaToken: { type: string }
        code: { type: string, description: "TOTP or recovery code" }
    TokenPair:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: seconds }
        refreshToken:
          type: string
          description: Present only for non-cookie clients; browsers get the httpOnly cookie.
    Me:
      type: object
      required: [id, email, mfaEnabled, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string, nullable: true }
        mfaEnabled: { type: boolean }
        emailVerified: { type: boolean }
    MeContext:
      type: object
      required: [userId, tenantId, tenantType, roles, permissions]
      properties:
        userId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        tenantType: { type: string, enum: [PLATFORM, RESELLER, CUSTOMER] }
        roles:
          type: array
          items:
            type: object
            required: [id, key, name, isSystem]
            properties:
              id: { type: string, format: uuid }
              key: { type: string }
              name: { type: string }
              isSystem: { type: boolean }
        permissions:
          type: array
          items: { type: string }
          description: Expanded concrete permission keys (wildcards resolved), sorted.
    Member:
      type: object
      required: [membershipId, status, user, roles]
      properties:
        membershipId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, SUSPENDED], description: Membership status in this tenant. }
        user:
          type: object
          required: [id, email, fullName, status]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            fullName: { type: string, nullable: true }
            status: { type: string, enum: [ACTIVE, INVITED, DISABLED], description: User account status. }
        roles:
          type: array
          description: Roles assigned to this membership in this tenant.
          items:
            type: object
            required: [id, key, name]
            properties:
              id: { type: string, format: uuid }
              key: { type: string }
              name: { type: string }
    Session:
      type: object
      required: [id, createdAt, lastSeenAt, current]
      properties:
        id: { type: string, format: uuid }
        deviceLabel: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }
    LoginAttempt:
      type: object
      required: [id, success, createdAt]
      properties:
        id: { type: string, format: uuid }
        success: { type: boolean }
        failureReason: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    SecurityEvent:
      type: object
      required: [id, type, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        metadata: { type: object, nullable: true }
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    EngineHealth:
      type: object
      required: [status]
      description: Honest engine health; UNKNOWN until a real adapter + probe exist.
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        latencyMs: { type: number }
        detail: { type: string }
    EngineCapabilities:
      type: object
      description: Explicit per-operation capability flags (never inferred from type).
      required: [health, routing, registration, activeCalls, originate, configuration]
      properties:
        health: { type: boolean }
        routing: { type: boolean }
        registration: { type: boolean }
        activeCalls: { type: boolean }
        originate: { type: boolean }
        configuration: { type: boolean }
    Engine:
      type: object
      required: [id, name, type, environment, status, capabilities, softwareCapabilities, implemented, health, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [KAMAILIO, ASTERISK, FREESWITCH] }
        provider: { type: string, nullable: true }
        version: { type: string, nullable: true }
        endpoint: { type: string, nullable: true, description: "Management/API host reference — never a secret." }
        credentialId: { type: string, format: uuid, nullable: true, description: "Vault reference only — never the secret." }
        environment: { type: string, enum: [DEVELOPMENT, STAGING, PRODUCTION] }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        regionId: { type: string, format: uuid, nullable: true }
        capabilities:
          type: array
          description: Admin-enabled capability keys configured for this engine instance.
          items: { type: string }
        softwareCapabilities: { $ref: "#/components/schemas/EngineCapabilities" }
        implemented: { type: boolean, description: "Whether the provider adapter is implemented (vs an honest stub)." }
        health: { $ref: "#/components/schemas/EngineHealth" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EngineConnection:
      type: object
      required: [state, endpointConfigured]
      properties:
        state: { type: string, enum: [UNCONFIGURED, DISABLED, BLOCKED, UNVERIFIED, REACHABLE, UNREACHABLE] }
        endpointConfigured: { type: boolean }
        detail: { type: string }
    EngineVersionPosture:
      type: object
      required: [desiredVersion, appliedVersion, syncState, versions]
      properties:
        desiredVersion: { type: string, nullable: true, description: "Short fingerprint of the desired config; null until any assignment." }
        appliedVersion: { type: string, nullable: true, description: "Short fingerprint last applied; null until a real engine applies." }
        syncState: { type: string, nullable: true, enum: [NOOP, APPLIED, PENDING_RECONCILIATION, FAILED] }
        versions: { type: integer, description: "Count of desired-config snapshots in history." }
    EngineDesiredPreview:
      type: object
      required: [version, summary]
      properties:
        version: { type: string, description: "Short fingerprint of the current desired config." }
        summary:
          type: object
          additionalProperties: { type: integer }
          description: "Counts per resource kind (carriers, trunks, dids, routes)."
    EngineStatus:
      type: object
      required: [provider, implemented, capabilities, health, correlationId, checkedAt, connection, version, desired]
      properties:
        engineId: { type: string, format: uuid }
        provider: { type: string, enum: [KAMAILIO, ASTERISK, FREESWITCH] }
        implemented: { type: boolean }
        capabilities: { $ref: "#/components/schemas/EngineCapabilities" }
        health: { $ref: "#/components/schemas/EngineHealth" }
        correlationId: { type: string }
        checkedAt: { type: string, format: date-time }
        connection: { $ref: "#/components/schemas/EngineConnection" }
        version: { $ref: "#/components/schemas/EngineVersionPosture" }
        desired: { $ref: "#/components/schemas/EngineDesiredPreview" }
    Region:
      type: object
      required: [id, code, name, country, timezone, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: "Stable region code, e.g. us-east." }
        name: { type: string }
        country: { type: string, description: "ISO-3166-1 alpha-2." }
        timezone: { type: string, description: "IANA timezone." }
        providerRegion: { type: string, nullable: true }
        failoverRegionId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NodeHealth:
      type: object
      required: [status]
      description: Heartbeat health for a node; UNKNOWN until it reports.
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        latencyMs: { type: integer, nullable: true }
        lastHeartbeatAt: { type: string, format: date-time, nullable: true }
    Node:
      type: object
      required: [id, name, engineId, environment, status, health, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        engineId: { type: string, format: uuid }
        regionId: { type: string, format: uuid, nullable: true }
        zone: { type: string, nullable: true }
        environment: { type: string, enum: [DEVELOPMENT, STAGING, PRODUCTION] }
        hostRef: { type: string, nullable: true, description: "Address reference — never a secret." }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        version: { type: string, nullable: true }
        maxCps: { type: integer, nullable: true, description: "Configured capacity ceiling, not a live value." }
        maxConcurrentCalls: { type: integer, nullable: true }
        health: { $ref: "#/components/schemas/NodeHealth" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EngineHealthReport:
      type: object
      required: [engineId, provider, status, reachability, detail, correlationId, checkedAt]
      properties:
        engineId: { type: string, format: uuid }
        provider: { type: string, enum: [KAMAILIO, ASTERISK, FREESWITCH] }
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        reachability: { type: string, enum: [UNCONFIGURED, DISABLED, BLOCKED, UNVERIFIED, REACHABLE, UNREACHABLE] }
        latencyMs: { type: integer }
        detail: { type: string, description: "Safe reason — never secrets or raw provider errors." }
        correlationId: { type: string }
        checkedAt: { type: string, format: date-time }
    SyncOutcome:
      type: object
      required: [ok, outcome, syncState, desiredVersion, appliedVersion, changed, correlationId]
      properties:
        ok: { type: boolean }
        outcome: { type: string }
        code: { type: string, enum: [NOT_IMPLEMENTED, UNAVAILABLE, TIMEOUT, INVALID_CONFIG, UNSUPPORTED, INTERNAL] }
        syncState: { type: string, enum: [NOOP, APPLIED, PENDING_RECONCILIATION, FAILED] }
        desiredVersion: { type: string }
        appliedVersion: { type: string, nullable: true }
        changed: { type: boolean }
        correlationId: { type: string }
        detail: { type: string }
    CarrierCredentialRef:
      type: object
      required: [id, type, label, scope]
      description: Non-secret vault reference attached to a carrier — never the secret itself.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [SIP_PASSWORD, CARRIER_API, ENGINE_API] }
        label: { type: string }
        hint: { type: string, nullable: true }
        scope: { type: string, enum: [SYSTEM, TENANT] }
    CarrierHealth:
      type: object
      required: [status, detail]
      description: Honest carrier health; UNKNOWN until a real probe exists (never fabricated).
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        detail: { type: string }
    Carrier:
      type: object
      required: [id, scope, name, status, codecs, credential, health, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [SYSTEM, TENANT], description: "System (platform-owned) or tenant-owned." }
        name: { type: string }
        type: { type: string, nullable: true, enum: [ORIGINATION, TERMINATION, BIDIRECTIONAL] }
        country: { type: string, nullable: true, description: "ISO-3166-1 alpha-2." }
        regionId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED], description: "Administrative status (distinct from health)." }
        priority: { type: integer, nullable: true }
        codecs:
          type: array
          items: { type: string, enum: [PCMU, PCMA, G722, G729, OPUS, AMR, AMR_WB] }
        maxCps: { type: integer, nullable: true }
        maxConcurrentCalls: { type: integer, nullable: true }
        credential:
          oneOf:
            - $ref: "#/components/schemas/CarrierCredentialRef"
            - type: "null"
        health: { $ref: "#/components/schemas/CarrierHealth" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CarrierPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Carrier" }
        nextCursor: { type: string, format: uuid, nullable: true, description: "Pass as `cursor` to fetch the next page; null when exhausted." }
    InlineCredentialInput:
      type: object
      required: [type, label, secret]
      description: >-
        A vault credential to create and attach in the same request. The secret
        is written straight to the encrypted vault; it is never stored on or
        returned from the carrier. Write-only.
      properties:
        type: { type: string, enum: [SIP_PASSWORD, CARRIER_API, ENGINE_API] }
        label: { type: string, minLength: 1, maxLength: 120 }
        hint: { type: string, maxLength: 120 }
        secret: { type: string, minLength: 1, maxLength: 4096, description: "Write-only secret material (vaulted immediately)." }
    CreateCarrier:
      type: object
      required: [name]
      description: >-
        Create-carrier body. Scope/ownership are server-derived (no tenantId or
        scope field). Attach a credential by `credentialId` OR inline
        `credential`, never both.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [ORIGINATION, TERMINATION, BIDIRECTIONAL] }
        country: { type: string, minLength: 2, maxLength: 2, description: "ISO-3166-1 alpha-2, uppercase." }
        regionId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        priority: { type: integer, minimum: 0, maximum: 100000 }
        codecs:
          type: array
          maxItems: 32
          items: { type: string, enum: [PCMU, PCMA, G722, G729, OPUS, AMR, AMR_WB] }
        maxCps: { type: integer, minimum: 0, maximum: 1000000 }
        maxConcurrentCalls: { type: integer, minimum: 0, maximum: 10000000 }
        credentialId: { type: string, format: uuid, description: "Attach an existing vault credential." }
        credential: { $ref: "#/components/schemas/InlineCredentialInput" }
    UpdateCarrier:
      type: object
      description: >-
        Partial carrier update — only supplied fields change. Same credential
        rules as create (`credentialId` or inline `credential`, never both).
        Scope/ownership are never changed from the client.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [ORIGINATION, TERMINATION, BIDIRECTIONAL] }
        country: { type: string, minLength: 2, maxLength: 2, description: "ISO-3166-1 alpha-2, uppercase." }
        regionId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        priority: { type: integer, minimum: 0, maximum: 100000 }
        codecs:
          type: array
          maxItems: 32
          items: { type: string, enum: [PCMU, PCMA, G722, G729, OPUS, AMR, AMR_WB] }
        maxCps: { type: integer, minimum: 0, maximum: 1000000 }
        maxConcurrentCalls: { type: integer, minimum: 0, maximum: 10000000 }
        credentialId: { type: string, format: uuid }
        credential: { $ref: "#/components/schemas/InlineCredentialInput" }
    CarrierSummary:
      type: object
      required: [id, name, scope]
      description: Compact carrier reference carried on a SIP trunk.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: [SYSTEM, TENANT] }
    SipTrunkCredentialRef:
      type: object
      required: [id, type, label]
      description: Non-secret vault reference attached to a trunk — never the secret itself.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [SIP_PASSWORD, CARRIER_API, ENGINE_API] }
        label: { type: string }
        hint: { type: string, nullable: true }
    SipTrunkHealth:
      type: object
      required: [status, detail]
      description: Honest trunk health; UNKNOWN (no live connectivity in the control plane), never fabricated.
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        detail: { type: string }
    SipTrunk:
      type: object
      required:
        [id, name, carrierId, direction, port, transport, tls, authMode, allowedIps, codecs, srtp, status, credential, health, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        carrierId: { type: string, format: uuid }
        carrier:
          oneOf:
            - $ref: "#/components/schemas/CarrierSummary"
            - type: "null"
        direction: { type: string, enum: [INBOUND, OUTBOUND, BIDIRECTIONAL] }
        sipUri: { type: string, nullable: true }
        host: { type: string, nullable: true, description: "Host/IP reference — never a secret." }
        port: { type: integer }
        transport: { type: string, enum: [UDP, TCP, TLS] }
        tls: { type: boolean }
        authMode: { type: string, enum: [IP, CREDENTIALS] }
        allowedIps:
          type: array
          items: { type: string }
          description: "IP-auth ACL (addresses / CIDRs)."
        codecs:
          type: array
          items: { type: string, enum: [PCMU, PCMA, G722, G729, OPUS, AMR, AMR_WB] }
        srtp: { type: boolean }
        dtmfMode: { type: string, nullable: true, description: "DTMF relay mode, e.g. rfc2833 / info / inband." }
        maxCps: { type: integer, nullable: true }
        maxConcurrentCalls: { type: integer, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED], description: "Administrative status (distinct from health)." }
        credential:
          oneOf:
            - $ref: "#/components/schemas/SipTrunkCredentialRef"
            - type: "null"
        health: { $ref: "#/components/schemas/SipTrunkHealth" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SipTrunkPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SipTrunk" }
        nextCursor: { type: string, format: uuid, nullable: true, description: "Pass as `cursor` to fetch the next page; null when exhausted." }
    DidHealth:
      type: object
      required: [status, detail]
      description: Honest DID health; UNKNOWN (no live SIP-path check exists), never fabricated.
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        detail: { type: string }
    Did:
      type: object
      required: [id, e164, country, status, carrierId, sipTrunkId, routingProfileId, regionId, assignedAt, health, createdAt, updatedAt]
      description: A DID (phone number). Related resources are carried as reference ids only — never embedded objects.
      properties:
        id: { type: string, format: uuid }
        e164: { type: string, description: "Canonical E.164, e.g. +14155550100." }
        country: { type: string, description: "ISO-3166-1 alpha-2, derived from the number." }
        status: { type: string, enum: [AVAILABLE, RESERVED, ASSIGNED, ACTIVE, SUSPENDED, PORTING, RELEASED], description: "Lifecycle/administrative status (distinct from health)." }
        carrierId: { type: string, format: uuid, nullable: true }
        sipTrunkId: { type: string, format: uuid, nullable: true }
        routingProfileId: { type: string, format: uuid, nullable: true }
        regionId: { type: string, format: uuid, nullable: true }
        assignedAt: { type: string, format: date-time, nullable: true }
        health: { $ref: "#/components/schemas/DidHealth" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DidPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Did" }
        nextCursor: { type: string, format: uuid, nullable: true, description: "Pass as `cursor` to fetch the next page; null when exhausted." }
    RoutingPolicy:
      type: object
      required: [selectionStrategy, failoverEnabled, failoverConditions, maxAttempts, overallTimeoutSeconds]
      description: Declarative selection + failover policy for a profile's rules (never executed).
      properties:
        selectionStrategy: { type: string, enum: [PRIORITY, WEIGHTED, ROUND_ROBIN, SIMULTANEOUS] }
        failoverEnabled: { type: boolean }
        failoverConditions:
          type: array
          items: { type: string, enum: [NO_ANSWER, BUSY, FAILED, UNREACHABLE, TIMEOUT] }
        maxAttempts: { type: integer, nullable: true, description: "Bounded attempt cap (loop protection)." }
        overallTimeoutSeconds: { type: integer, nullable: true }
    RoutingRule:
      type: object
      required: [id, destinationType, destination, priority, weight, enabled, timeoutSeconds, retryCount, carrierId, failoverDestination, failoverDestinationType, failoverAfterSeconds, schedule]
      description: A single declarative routing rule. Config only — nothing is dialled.
      properties:
        id: { type: string, format: uuid }
        destinationType: { type: string, enum: [SIP_TRUNK, PHONE_NUMBER, EXTENSION, VOICEMAIL, WEBHOOK] }
        destination: { type: string, description: "Canonical value validated per destinationType (E.164, trunk id, etc.)." }
        priority: { type: integer, description: "Deterministic order, ascending." }
        weight: { type: integer, nullable: true, description: "For the WEIGHTED strategy." }
        enabled: { type: boolean }
        timeoutSeconds: { type: integer, nullable: true }
        retryCount: { type: integer, nullable: true }
        carrierId: { type: string, format: uuid, nullable: true }
        failoverDestination: { type: string, nullable: true }
        failoverDestinationType: { type: string, nullable: true, enum: [SIP_TRUNK, PHONE_NUMBER, EXTENSION, VOICEMAIL, WEBHOOK] }
        failoverAfterSeconds: { type: integer, nullable: true }
        schedule:
          type: object
          nullable: true
          additionalProperties: true
          description: "Optional declarative schedule { timezone, daysOfWeek[], startMinute, endMinute }."
    RoutingProfile:
      type: object
      required: [id, name, direction, description, status, version, policy, rules, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        direction: { type: string, enum: [INBOUND, OUTBOUND] }
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED], description: "Administrative status." }
        version: { type: integer, description: "Optimistic-concurrency version." }
        policy: { $ref: "#/components/schemas/RoutingPolicy" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/RoutingRule" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RoutingProfilePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RoutingProfile" }
        nextCursor: { type: string, format: uuid, nullable: true, description: "Pass as `cursor` to fetch the next page; null when exhausted." }
    LcrRoute:
      type: object
      required: [id, carrierId, sipTrunkId, prefix, country, costMicros, currency, priority, weight, enabled, effectiveFrom, effectiveTo]
      description: A single LCR route candidate. Config only — never dialled or rated.
      properties:
        id: { type: string, format: uuid }
        carrierId: { type: string, format: uuid }
        sipTrunkId: { type: string, format: uuid, nullable: true }
        prefix: { type: string, description: "E.164-style destination prefix, e.g. 44, 9198." }
        country: { type: string, nullable: true, description: "ISO-3166-1 alpha-2." }
        costMicros: { type: integer, description: "Millionths of a currency unit (integer, non-negative)." }
        currency: { type: string, enum: [USD, EUR, GBP, INR, AUD, CAD, JPY] }
        priority: { type: integer, description: "Lower number = higher preference." }
        weight: { type: integer, nullable: true, description: "For the WEIGHTED strategy." }
        enabled: { type: boolean }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        effectiveTo: { type: string, format: date-time, nullable: true }
    LcrPolicy:
      type: object
      required: [id, name, description, selectionStrategy, enabled, version, candidates, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        selectionStrategy: { type: string, enum: [LOWEST_COST, HIGHEST_PRIORITY, WEIGHTED, QUALITY_FIRST] }
        enabled: { type: boolean }
        version: { type: integer, description: "Optimistic-concurrency version." }
        candidates:
          type: array
          description: Route candidates in deterministic selection order for the policy's strategy.
          items: { $ref: "#/components/schemas/LcrRoute" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LcrPolicyPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LcrPolicy" }
        nextCursor: { type: string, format: uuid, nullable: true, description: "Pass as `cursor` to fetch the next page; null when exhausted." }
