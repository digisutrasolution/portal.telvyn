      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [ORIGINATION, TERMINATION, BIDIRECTIONAL] }
        country: { type: string, minLength: 2, maxLength: 2, description: "ISO-3166-1 alpha-2, uppercase." }
        regionId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        priority: { type: integer, minimum: 0, maximum: 100000 }
        codecs:
          type: array
          maxItems: 32
          items: { type: string, enum: [PCMU, PCMA, G722, G729, OPUS, AMR, AMR_WB] }
        maxCps: { type: integer, minimum: 0, maximum: 1000000 }
        maxConcurrentCalls: { type: integer, minimum: 0, maximum: 10000000 }
        credentialId: { type: string, format: uuid }
        credential: { $ref: "#/components/schemas/InlineCredentialInput" }
    CarrierSummary:
      type: object
      required: [id, name, scope]
