      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        detail: { type: string }
    Carrier:
      type: object
      required: [id, scope, name, status, codecs, credential, health, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [SYSTEM, TENANT], description: "System (platform-owned) or tenant-owned." }
        name: { type: string }
        type: { type: string, nullable: true, enum: [ORIGINATION, TERMINATION, BIDIRECTIONAL] }
        country: { type: string, nullable: true, description: "ISO-3166-1 alpha-2." }
        regionId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED], description: "Administrative status (distinct from health)." }
        priority: { type: integer, nullable: true }
        codecs:
          type: array
          items: { type: string, enum: [PCMU, PCMA, G722, G729, OPUS, AMR, AMR_WB] }
