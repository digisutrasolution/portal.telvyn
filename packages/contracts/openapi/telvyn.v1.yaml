    post:
      tags: [telecom]
      summary: Probe carrier health (tenant + system)
      description: >-
        Operator-driven carrier health probe (foundation). There is no carrier
        liveness connector yet, so health is never fabricated: it is an honest posture
        from configuration — DISABLED when administratively disabled, UNCONFIGURED with
        no SIP endpoint, otherwise UNVERIFIED → UNKNOWN. Carriers have no health
        snapshot, so this is event-only: a CARRIER health event is recorded on a status
        transition, and the carrier's `health` is derived from the latest such event.
        No egress occurs. The carrier is scope-resolved (own + system); a
        foreign/unknown id is 404. Requires `telecom.health.read`.
      operationId: checkCarrierHealth
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Carrier health report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarrierHealthReport" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
