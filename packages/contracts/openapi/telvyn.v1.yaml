        correlationId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ConfigVersionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConfigVersion" }
        nextCursor: { type: string, format: uuid, nullable: true, description: "Pass as `cursor` to fetch the next (older) page; null when exhausted." }
    SyncOutcome:
      type: object
      required: [ok, outcome, syncState, desiredVersion, appliedVersion, changed, correlationId]
      properties:
        ok: { type: boolean }
        outcome: { type: string }
        code: { type: string, enum: [NOT_IMPLEMENTED, UNAVAILABLE, TIMEOUT, INVALID_CONFIG, UNSUPPORTED, INTERNAL] }
        syncState: { type: string, enum: [NOOP, APPLIED, PENDING_RECONCILIATION, FAILED] }
        desiredVersion: { type: string }
        appliedVersion: { type: string, nullable: true }
        changed: { type: boolean }
        correlationId: { type: string }
        detail: { type: string }
    CarrierCredentialRef:
      type: object
      required: [id, type, label, scope]
