        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [telecom]
      summary: Delete a routing profile (soft delete)
      description: >-
        Soft-delete a tenant-owned routing profile (sets deletedAt; the row is
        retained for audit and history). A foreign tenant's profile is 404
        (IDOR-safe). Requires `routing.manage`.
      operationId: deleteRoutingProfile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Routing profile deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/lcr-policies:
    get:
      tags: [telecom]
      summary: List LCR policies (tenant)
      description: >-
        The tenant's own least-cost-routing policies (strictly tenant-owned).
        Declarative route SELECTION only — nothing is executed, rated or billed.
        Each policy carries its route candidates in deterministic selection order
        for its strategy. `costMicros` is millionths of a currency unit (integer).
        Cursor-paginated. Requires `routing.read` (LCR is part of the routing
        domain).
      operationId: listLcrPolicies
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid }, description: "nextCursor from a prior page." }
        - { name: enabled, in: query, required: false, schema: { type: boolean } }
        - { name: strategy, in: query, required: false, schema: { type: string, enum: [LOWEST_COST, HIGHEST_PRIORITY, WEIGHTED, QUALITY_FIRST] } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 }, description: "Case-insensitive name search." }
      responses:
        "200":
          description: LCR policies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LcrPolicyPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [telecom]
      summary: Create an LCR policy
      description: >-
        Create a tenant-owned least-cost-routing policy. DECLARATIVE ROUTE
        SELECTION ONLY — nothing is executed, rated or billed. Ownership (tenantId)
        is server-derived. `routes` is optional (omitted = empty route set); each
        route's `carrierId` must be accessible in scope and any `sipTrunkId` must be
        owned, and `costMicros` is an integer in millionths of a currency unit
        (never floating point). A duplicate name is a 409. Requires `routing.manage`.
      operationId: createLcrPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLcrPolicy" }
      responses:
        "201":
          description: LCR policy created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LcrPolicy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/telecom/lcr-policies/{id}:
    get:
      tags: [telecom]
      summary: Get one LCR policy (tenant)
      description: >-
        A single least-cost-routing policy owned by the session's tenant, with its
        complete set of route candidates in deterministic selection order for the
        policy's strategy. A foreign tenant's policy is reported as 404 (IDOR-safe).
        Declarative route SELECTION only — nothing is executed, rated or billed.
        `costMicros` is millionths of a currency unit (integer). Requires
        `routing.read` (LCR is part of the routing domain).
      operationId: getLcrPolicy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: LCR policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LcrPolicy" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [telecom]
      summary: Update an LCR policy
      description: >-
        Partially update a tenant-owned LCR policy. DECLARATIVE ROUTE SELECTION
        ONLY — nothing is executed, rated or billed. Only supplied fields change;
        ownership is never taken from the client, and a foreign tenant's policy is
        404 (IDOR-safe). If `routes` is present it REPLACES the entire route set
        atomically; when omitted the existing routes are left untouched. Pass
        `expectedVersion` for optimistic concurrency — a version mismatch is a 409.
        A duplicate name is a 409. Requires `routing.manage`.
      operationId: updateLcrPolicy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLcrPolicy" }
      responses:
        "200":
          description: LCR policy updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LcrPolicy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [telecom]
      summary: Delete an LCR policy (soft delete)
      description: >-
        Soft-delete a tenant-owned LCR policy (sets deletedAt; the row is retained
        for audit and history). A foreign tenant's policy is 404 (IDOR-safe).
        Requires `routing.manage`.
      operationId: deleteLcrPolicy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: LCR policy deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/fraud/events:
    get:
      tags: [fraud]
      summary: List fraud events (tenant)
      description: >-
        The active tenant's own fraud events (Phase 12R-1, ADR-0021), newest
        first, cursor-paginated. Append-only, read-only foundation — there is NO
        enforcement here (no spend/velocity/geo/destination/kill-switch control,
        no call authorization). Strictly tenant-scoped (other tenants' events are
        never returned); the safe view never echoes the tenant linkage. Optional
        `type` / `severity` filters. Requires `fraud.events.read`.
      operationId: listFraudEvents
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid }, description: "nextCursor from a prior page." }
        - { name: type, in: query, required: false, schema: { type: string, enum: [AUTHORIZATION_DENIED, LIMIT_WARNING, KILL_SWITCH, POLICY_CHANGE, ANOMALY] } }
        - { name: severity, in: query, required: false, schema: { type: string, enum: [INFO, WARNING, CRITICAL] } }
      responses:
        "200":
          description: Fraud events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FraudEventPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    nodeAgentMTLS:
      type: mutualTLS
      description: >-
        Node-agent client-certificate (mTLS) authentication for the heartbeat
        ingest (ADR-0020). The certificate is verified by a real mTLS terminator
        and bound to the node's NODE_AGENT vault credential; the control plane
        never derives identity from a spoofable header or body field.
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        issues: { type: array, items: { type: object } }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 128 }
    LoginResult:
      oneOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [mfaRequired, mfaToken]
          properties:
            mfaRequired: { type: boolean, const: true }
            mfaToken: { type: string, description: "5-minute single-purpose JWT" }
    MfaVerifyRequest:
      type: object
      required: [mfaToken, code]
      properties:
        mfaToken: { type: string }
        code: { type: string, description: "TOTP or recovery code" }
    TokenPair:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: seconds }
        refreshToken:
          type: string
          description: Present only for non-cookie clients; browsers get the httpOnly cookie.
    Me:
      type: object
      required: [id, email, mfaEnabled, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string, nullable: true }
        mfaEnabled: { type: boolean }
        emailVerified: { type: boolean }
    MeContext:
      type: object
      required: [userId, tenantId, tenantType, roles, permissions]
      properties:
        userId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        tenantType: { type: string, enum: [PLATFORM, RESELLER, CUSTOMER] }
        roles:
          type: array
          items:
            type: object
            required: [id, key, name, isSystem]
            properties:
              id: { type: string, format: uuid }
              key: { type: string }
              name: { type: string }
              isSystem: { type: boolean }
        permissions:
          type: array
          items: { type: string }
          description: Expanded concrete permission keys (wildcards resolved), sorted.
    Member:
      type: object
      required: [membershipId, status, user, roles]
      properties:
        membershipId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, SUSPENDED], description: Membership status in this tenant. }
        user:
          type: object
          required: [id, email, fullName, status]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            fullName: { type: string, nullable: true }
            status: { type: string, enum: [ACTIVE, INVITED, DISABLED], description: User account status. }
        roles:
          type: array
          description: Roles assigned to this membership in this tenant.
          items:
            type: object
            required: [id, key, name]
            properties:
              id: { type: string, format: uuid }
              key: { type: string }
              name: { type: string }
    Role:
      type: object
      required: [id, key, name, description, isSystem, permissions]
      description: A role assignable in the current tenant — a shared system role or a tenant custom role.
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        isSystem: { type: boolean, description: "System roles are shared, read-only templates (cannot be edited/deleted)." }
        permissions:
          type: array
          description: Permission keys this role grants.
          items: { type: string }
    SetMemberRoles:
      type: object
      required: [roleIds]
      description: >-
        The complete set of roles to assign to a membership (replace semantics).
        Each id must be a role valid for the tenant; send distinct ids. An empty
        array removes all of the member's roles.
      properties:
        roleIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
    Session:
      type: object
      required: [id, createdAt, lastSeenAt, current]
      properties:
        id: { type: string, format: uuid }
        deviceLabel: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }
    LoginAttempt:
      type: object
      required: [id, success, createdAt]
      properties:
        id: { type: string, format: uuid }
        success: { type: boolean }
        failureReason: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    SecurityEvent:
      type: object
      required: [id, type, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        metadata: { type: object, nullable: true }
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    EngineHealth:
      type: object
      required: [status]
      description: Honest engine health; UNKNOWN until a real adapter + probe exist.
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        latencyMs: { type: number }
        detail: { type: string }
    EngineCapabilities:
      type: object
      description: Explicit per-operation capability flags (never inferred from type).
      required: [health, routing, registration, activeCalls, originate, configuration]
      properties:
        health: { type: boolean }
        routing: { type: boolean }
        registration: { type: boolean }
        activeCalls: { type: boolean }
        originate: { type: boolean }
        configuration: { type: boolean }
    Engine:
      type: object
      required: [id, name, type, environment, status, capabilities, softwareCapabilities, implemented, health, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [KAMAILIO, ASTERISK, FREESWITCH] }
        provider: { type: string, nullable: true }
        version: { type: string, nullable: true }
        endpoint: { type: string, nullable: true, description: "Management/API host reference — never a secret." }
        credentialId: { type: string, format: uuid, nullable: true, description: "Vault reference only — never the secret." }
        environment: { type: string, enum: [DEVELOPMENT, STAGING, PRODUCTION] }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        regionId: { type: string, format: uuid, nullable: true }
        capabilities:
          type: array
          description: Admin-enabled capability keys configured for this engine instance.
          items: { type: string }
        softwareCapabilities: { $ref: "#/components/schemas/EngineCapabilities" }
        implemented: { type: boolean, description: "Whether the provider adapter is implemented (vs an honest stub)." }
        health: { $ref: "#/components/schemas/EngineHealth" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EngineConnection:
      type: object
      required: [state, endpointConfigured]
      properties:
        state: { type: string, enum: [UNCONFIGURED, DISABLED, BLOCKED, UNVERIFIED, REACHABLE, UNREACHABLE] }
        endpointConfigured: { type: boolean }
        detail: { type: string }
    EngineVersionPosture:
      type: object
      required: [desiredVersion, appliedVersion, syncState, versions]
      properties:
        desiredVersion: { type: string, nullable: true, description: "Short fingerprint of the desired config; null until any assignment." }
        appliedVersion: { type: string, nullable: true, description: "Short fingerprint last applied; null until a real engine applies." }
        syncState: { type: string, nullable: true, enum: [NOOP, APPLIED, PENDING_RECONCILIATION, FAILED] }
        versions: { type: integer, description: "Count of desired-config snapshots in history." }
    EngineDesiredPreview:
      type: object
      required: [version, summary]
      properties:
        version: { type: string, description: "Short fingerprint of the current desired config." }
        summary:
          type: object
          additionalProperties: { type: integer }
          description: "Counts per resource kind (carriers, trunks, dids, routes)."
    EngineStatus:
      type: object
      required: [provider, implemented, capabilities, health, correlationId, checkedAt, connection, version, desired]
      properties:
        engineId: { type: string, format: uuid }
        provider: { type: string, enum: [KAMAILIO, ASTERISK, FREESWITCH] }
        implemented: { type: boolean }
        capabilities: { $ref: "#/components/schemas/EngineCapabilities" }
        health: { $ref: "#/components/schemas/EngineHealth" }
        correlationId: { type: string }
        checkedAt: { type: string, format: date-time }
        connection: { $ref: "#/components/schemas/EngineConnection" }
        version: { $ref: "#/components/schemas/EngineVersionPosture" }
        desired: { $ref: "#/components/schemas/EngineDesiredPreview" }
    Region:
      type: object
      required: [id, code, name, country, timezone, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: "Stable region code, e.g. us-east." }
        name: { type: string }
        country: { type: string, description: "ISO-3166-1 alpha-2." }
        timezone: { type: string, description: "IANA timezone." }
        providerRegion: { type: string, nullable: true }
        failoverRegionId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NodeHealth:
      type: object
      required: [status]
      description: Heartbeat health for a node; UNKNOWN until it reports.
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        latencyMs: { type: integer, nullable: true }
        lastHeartbeatAt: { type: string, format: date-time, nullable: true }
    Node:
      type: object
      required: [id, name, engineId, environment, status, health, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        engineId: { type: string, format: uuid }
        regionId: { type: string, format: uuid, nullable: true }
        zone: { type: string, nullable: true }
        environment: { type: string, enum: [DEVELOPMENT, STAGING, PRODUCTION] }
        hostRef: { type: string, nullable: true, description: "Address reference — never a secret." }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        version: { type: string, nullable: true }
        maxCps: { type: integer, nullable: true, description: "Configured capacity ceiling, not a live value." }
        maxConcurrentCalls: { type: integer, nullable: true }
        health: { $ref: "#/components/schemas/NodeHealth" }
        credential:
          description: The node-agent mTLS credential reference (non-secret), or null if none is attached.
          oneOf:
            - $ref: "#/components/schemas/NodeCredentialRef"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NodeCredentialRef:
      type: object
      required: [id, type, label, scope]
      description: Non-secret vault reference to a node's NODE_AGENT mTLS credential — never the secret.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [NODE_AGENT] }
        label: { type: string }
        hint: { type: string, nullable: true, description: "The client certificate's SHA-256 fingerprint (non-secret)." }
        scope: { type: string, enum: [SYSTEM, TENANT] }
    AttachNodeCredential:
      type: object
      required: [certificate]
      description: Attach/rotate a node-agent mTLS credential. The node's PUBLIC client certificate (PEM); the private key stays on the node.
      properties:
        certificate: { type: string, description: "PEM-encoded X.509 client certificate." }
        label: { type: string }
    NodeHealthReport:
      type: object
      required: [nodeId, status, reachability, detail, correlationId, checkedAt]
      description: Outcome of an operator node health probe (honest posture; never fabricated HEALTHY until a connector exists).
      properties:
        nodeId: { type: string, format: uuid }
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        reachability: { type: string, enum: [UNCONFIGURED, DISABLED, UNVERIFIED] }
        detail: { type: string, description: "Safe reason — never secrets or raw host details." }
        correlationId: { type: string }
        checkedAt: { type: string, format: date-time }
    NodeHeartbeat:
      type: object
      description: Optional non-secret liveness payload a node agent may include (ADR-0020). Never credentials, dialplans or call content.
      properties:
        version: { type: string, description: "The node's reported build/version." }
        uptimeSeconds: { type: integer, minimum: 0 }
    HeartbeatAck:
      type: object
      required: [status, nodeId, acceptedAt, correlationId]
      description: Acknowledgement of an accepted heartbeat (liveness stamped; no status transition).
      properties:
        status: { type: string, enum: [accepted] }
        nodeId: { type: string, format: uuid }
        acceptedAt: { type: string, format: date-time }
        correlationId: { type: string }
    NodeHealthEvaluation:
      type: object
      required: [skipped, evaluated, transitioned, correlationId]
      description: Summary of one dead-man's-switch evaluator tick (ADR-0020).
      properties:
        skipped: { type: boolean, description: "True when the tick did not run (lock held, or Redis unavailable)." }
        reason: { type: string, enum: [locked, lock-unavailable], description: "Present only when skipped." }
        evaluated: { type: integer, minimum: 0, description: "Nodes examined this tick." }
        transitioned: { type: integer, minimum: 0, description: "Nodes whose health status changed." }
        correlationId: { type: string }
    CarrierHealthReport:
      type: object
      required: [carrierId, status, reachability, detail, correlationId, checkedAt]
      description: Outcome of an operator carrier health probe (honest posture; never fabricated HEALTHY until a connector exists).
      properties:
        carrierId: { type: string, format: uuid }
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        reachability: { type: string, enum: [UNCONFIGURED, DISABLED, UNVERIFIED] }
        detail: { type: string, description: "Safe reason — never secrets or raw endpoint details." }
        correlationId: { type: string }
        checkedAt: { type: string, format: date-time }
    EngineHealthReport:
      type: object
      required: [engineId, provider, status, reachability, detail, correlationId, checkedAt]
      properties:
        engineId: { type: string, format: uuid }
        provider: { type: string, enum: [KAMAILIO, ASTERISK, FREESWITCH] }
        status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        reachability: { type: string, enum: [UNCONFIGURED, DISABLED, BLOCKED, UNVERIFIED, REACHABLE, UNREACHABLE] }
        latencyMs: { type: integer }
        detail: { type: string, description: "Safe reason — never secrets or raw provider errors." }
        correlationId: { type: string }
        checkedAt: { type: string, format: date-time }
    HealthEvent:
      type: object
      required: [id, toStatus, createdAt]
      description: One append-only health-status transition for an engine (config-plane history; no secrets).
      properties:
        id: { type: string, format: uuid }
        fromStatus: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED], nullable: true, description: "null for the first-ever event." }
        toStatus: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN, DISABLED] }
        reason: { type: string, nullable: true, description: "Safe reason — never secrets or raw provider errors." }
        correlationId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    HealthEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HealthEvent" }
        nextCursor: { type: string, format: uuid, nullable: true, description: "Pass as `cursor` to fetch the next (older) page; null when exhausted." }
    FraudEvent:
      type: object
      required: [id, type, severity, source, code, createdAt]
      description: >-
        One append-only, immutable fraud event (Phase 12R-1, ADR-0021). Tenant
        linkage is never echoed. No secrets or unnecessary personal data appear
        in `reason` or `metadata`.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [AUTHORIZATION_DENIED, LIMIT_WARNING, KILL_SWITCH, POLICY_CHANGE, ANOMALY] }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        source: { type: string, description: "The control that raised it, e.g. velocity | spend | geo | kill-switch." }
        code: { type: string, description: "Short machine reason code, e.g. DAILY_SPEND_EXCEEDED." }
        reason: { type: string, nullable: true, description: "Safe human-readable text — never secrets or PII." }
        correlationId: { type: string, nullable: true, description: "Ties to a call attempt / request (future producers)." }
        actorId: { type: string, format: uuid, nullable: true, description: "The user whose action raised it; null for system-raised events." }
        metadata: { type: object, nullable: true, additionalProperties: true, description: "Bounded structured context; never secrets or unnecessary PII." }
        createdAt: { type: string, format: date-time }
    FraudEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
