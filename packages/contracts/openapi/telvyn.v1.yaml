openapi: 3.1.0
info:
  title: Telvyn DID Portal API
  version: 0.2.0
  description: >
    Telvyn PROMAX control-plane API. Contract-first: this document is authored
    before implementation; clients are generated from it. Errors are RFC 7807
    application/problem+json. Auth: short-lived Bearer access token; opaque
    rotating refresh token in an httpOnly SameSite=Strict cookie (tv_refresh,
    path=/v1/auth) or request body for non-browser clients.
servers:
  - url: http://localhost:3311
    description: local development
tags:
  - name: auth
  - name: telecom
  - name: fraud
security:
  - bearerAuth: []
paths:
  /v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Login with email + password (step 1; MFA challenge when enabled)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Tokens issued, or MFA challenge required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "423": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/mfa/verify:
    post:
      tags: [auth]
      security: []
      summary: Complete an MFA-challenged login (step 2)
      operationId: mfaVerify
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaVerifyRequest" }
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Rotate the refresh token; reuse is detected and revokes the session
      operationId: refresh
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: "Only for non-cookie clients" }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session and clear the refresh cookie
      operationId: logout
      responses:
        "204": { description: Logged out }
  /v1/auth/logout-all:
    post:
      tags: [auth]
      summary: Revoke every session of the current user
      operationId: logoutAll
      responses:
        "204": { description: All sessions revoked }
  /v1/auth/me:
    get:
      tags: [auth]
      summary: Current authenticated user
      operationId: me
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me/context:
    get:
      tags: [authz]
      summary: Current authorization context (identity + active tenant + roles + permissions)
      description: >-
        Self-scoped "whoami" for the authenticated session. Returns the
        server-derived tenant context (ADR-0004): the active tenant and its
        type, the membership's roles, and the expanded concrete permission keys.
        No permission is required beyond an authenticated session with an active
        membership — the frontend calls this at bootstrap, before it knows any
        permissions. Never accepts or trusts a client-supplied tenant id.
      operationId: meContext
      responses:
        "200":
          description: Authorization context for the current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeContext" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/members:
    get:
      tags: [authz]
      summary: List members of the current tenant
      description: >-
        The members of the session's own tenant (strictly tenant-scoped — a
        foreign tenant's members are never returned; the tenant id comes from
        the server-derived context, never the client). Each member carries the
        user's identity, the membership status, and the roles assigned to the
        membership in this tenant. Ordered by join time (createdAt ASC). No
        secrets appear. Requires `member.read`.
      operationId: listMembers
      responses:
        "200":
          description: Members of the current tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/members/{id}/roles:
    put:
      tags: [authz]
      summary: Set a member's roles
      description: >-
        Replace the set of roles assigned to a membership in the current tenant.
        The membership is resolved from the server-derived tenant context (a
        foreign tenant's membership is 404 — IDOR-safe). Every `roleIds` entry must
        be a role valid for this tenant — a system role or one of this tenant's own
        custom roles — or the request is a 409; duplicates are rejected the same
        way. The replacement is atomic. Returns the full, updated member list.
        Requires `member.manage`.
      operationId: setMemberRoles
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: "The membership id (Member.membershipId)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetMemberRoles" }
      responses:
        "200":
          description: The updated member list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/roles:
    get:
      tags: [authz]
      summary: List roles assignable in the current tenant
      description: >-
        The roles available in the session's tenant — the shared system roles plus
        this tenant's own custom roles — each with its permission keys. Ordered
        system-first, then by name. Used to populate the member role picker.
        Requires `role.read`.
      operationId: listRoles
      responses:
        "200":
          description: Assignable roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/auth/sessions:
    get:
      tags: [auth]
      summary: List sessions/devices for the current user
      operationId: listSessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
  /v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Revoke one session (device sign-out)
      operationId: revokeSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/auth/login-history:
    get:
      tags: [auth]
      summary: Recent login attempts for the current user
      operationId: loginHistory
      responses:
        "200":
          description: Attempts, newest first (max 50)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoginAttempt" }
  /v1/auth/security-events:
    get:
      tags: [auth]
      summary: Recent security events for the current user
      operationId: securityEvents
      responses:
        "200":
          description: Events, newest first (max 50)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecurityEvent" }
  /v1/auth/password-reset/request:
    post:
      tags: [auth]
      security: []
      summary: Request a password-reset email (always 202 — no account enumeration)
      operationId: passwordResetRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Accepted (queued if the account exists) }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      security: []
      summary: Set a new password with a reset token; revokes all sessions
      operationId: passwordResetConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Password updated }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/auth/email-verification/request:
    post:
      tags: [auth]
      summary: Send (queue) an email-verification message for the current user
      operationId: emailVerificationRequest
      responses:
        "202": { description: Queued }
  /v1/auth/email-verification/confirm:
    post:
      tags: [auth]
      security: []
      summary: Confirm email ownership with a verification token
      operationId: emailVerificationConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Email verified }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/auth/mfa/enroll:
    post:
      tags: [auth]
      summary: Begin TOTP enrollment (returns otpauth URI; not yet enabled)
      operationId: mfaEnroll
      responses:
        "200":
          description: Enrollment data
          content:
            application/json:
              schema:
                type: object
                required: [otpauthUri]
                properties:
                  otpauthUri: { type: string }
  /v1/auth/mfa/enable:
    post:
      tags: [auth]
      summary: Enable MFA by proving a TOTP code; returns one-time recovery codes
      operationId: mfaEnable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "200":
          description: MFA enabled
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/auth/mfa/disable:
    post:
      tags: [auth]
      summary: Disable MFA (step-up — requires current password AND a valid code)
      operationId: mfaDisable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, description: "TOTP or recovery code" }
      responses:
        "204": { description: MFA disabled }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines:
    get:
      tags: [telecom]
      summary: List telecom engines (platform)
      description: >-
        Platform-scoped list of configured telecom engines with their honest
        health (UNKNOWN for stub adapters — never fabricated). Requires an active
        PLATFORM tenant and `telecom.read`. Read-only.
      operationId: listEngines
      responses:
        "200":
          description: Engines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines/{id}:
    get:
      tags: [telecom]
      summary: Get one telecom engine (platform)
      operationId: getEngine
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Engine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engine" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines/{id}/status:
    get:
      tags: [telecom]
      summary: Normalized engine status — health + connection + config version (platform)
      description: >-
        Read-only, SSRF-guarded status with honest health (UNKNOWN for stubs; no
        live egress with the Null connector), connection reachability, and the
        config version posture (desired/applied) plus the live desired-config
        summary. Requires PLATFORM + `telecom.health.read`.
      operationId: getEngineStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Engine status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/regions:
    get:
      tags: [telecom]
      summary: List telecom regions (platform)
      description: Platform-scoped list of regions. Requires PLATFORM + `telecom.read`. Read-only.
      operationId: listRegions
      responses:
        "200":
          description: Regions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Region" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/telecom/nodes:
    get:
      tags: [telecom]
      summary: List telecom nodes with heartbeat health (platform)
      description: >-
        Platform-scoped list of nodes with honest heartbeat health (UNKNOWN until
        a node reports). Requires PLATFORM + `telecom.read`. Read-only.
      operationId: listNodes
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/telecom/nodes/{id}/health-check:
    post:
      tags: [telecom]
      summary: Probe node health (platform)
      description: >-
        Operator-driven node health probe (foundation). There is no node liveness
        connector yet, so health is never fabricated: it is an honest posture from
        configuration — DISABLED when administratively disabled, UNCONFIGURED with no
        host reference, otherwise UNVERIFIED → UNKNOWN. The node's health snapshot is
        updated and a NODE health event is recorded on a status transition. No egress
        occurs. An unknown node id is 404. Requires PLATFORM + `telecom.health.read`.
      operationId: checkNodeHealth
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Node health report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeHealthReport" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/nodes/{id}/health-events:
    get:
      tags: [telecom]
      summary: Node health-event history (platform)
      description: >-
        The append-only history of this node's health-status transitions (recorded
        by the node health probe; a new event only on a genuine change). Newest
        first, cursor-paginated. Each event carries the from/to status, a safe
        reason and a correlation id — the same shape as the engine health history. A
        foreign/unknown node id is 404. Requires PLATFORM + `telecom.health.read`.
      operationId: listNodeHealthEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid }, description: "nextCursor from a prior page." }
      responses:
        "200":
          description: Health events (newest first)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEventPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/nodes/{id}/heartbeat:
    post:
      tags: [telecom]
      summary: Node heartbeat ingest (node-agent mTLS)
      description: >-
        Machine endpoint (ADR-0020): a node agent reports liveness. It is NOT behind
        the human JWT/tenant/permission auth — its ONLY authentication is the node's
        NODE_AGENT **mTLS client certificate**, verified by a real mTLS terminator
        and bound to this node (a node can report only its own health). An accepted
        beat stamps `lastHeartbeatAt` only; it does NOT change health status (the
        dead-man's-switch evaluator owns transitions). Rate-limited per node;
        fail-closed if the limiter is unavailable. **Fails closed today**: until an
        inbound mTLS terminator is wired, no verified identity is produced and every
        beat is 401 — the control plane never trusts a spoofable signal. Not consumed
        by the web client.
      operationId: nodeHeartbeat
      security:
        - nodeAgentMTLS: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeHeartbeat" }
      responses:
        "202":
          description: Heartbeat accepted (liveness stamped)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeartbeatAck" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/telecom/nodes/health/evaluate:
    post:
      tags: [telecom]
      summary: Run the node dead-man's-switch evaluator (platform)
      description: >-
        Dead-man's-switch tick (ADR-0020): compares every node's `lastHeartbeatAt`
        to the staleness TTL and records honest status transitions — administratively
        DISABLED → DISABLED; a heartbeat within the TTL → HEALTHY; otherwise (stale or
        never seen) → UNKNOWN (it caps at UNKNOWN; no DEGRADED/UNHEALTHY from silence).
        A transition only on a genuine change, appended to the node's HealthEvent
        history. Multi-instance safe (Redis-locked, fail-closed → `skipped` when the
        lock is held or Redis is unavailable). Triggered by a platform operator or a
        dedicated external cron on the TTL cadence. Requires PLATFORM + `telecom.manage`.
      operationId: evaluateNodeHealth
      responses:
        "200":
          description: Evaluation summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeHealthEvaluation" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/telecom/nodes/{id}/credential:
    post:
      tags: [telecom]
      summary: Attach / rotate a node-agent mTLS credential (platform)
      description: >-
        Provision the node's NODE_AGENT mTLS identity (ADR-0020). Submit the node's
        PUBLIC client certificate (PEM) — the private key stays on the node and is
        never sent. The server derives the certificate's SHA-256 fingerprint (stored
        as the non-secret credential `hint`, the matcher the heartbeat ingest uses)
        and vaults the certificate. If the node already has a node-agent credential it
        is rotated (the prior one is soft-deleted). Requires PLATFORM + `telecom.manage`.
      operationId: attachNodeCredential
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachNodeCredential" }
      responses:
        "200":
          description: The node with its node-agent credential reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [telecom]
      summary: Detach the node-agent credential (platform)
      description: >-
        Remove the node's NODE_AGENT credential (the credential row is soft-deleted).
        Idempotent. Requires PLATFORM + `telecom.manage`.
      operationId: detachNodeCredential
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Credential detached }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines/{id}/health-check:
    post:
      tags: [telecom]
      summary: Probe engine health (platform)
      description: >-
        Actively probe the engine's health (SSRF-guarded; honest UNKNOWN with the
        Null connector) and record a health event on a transition. Requires
        PLATFORM + `telecom.health.read`.
      operationId: checkEngineHealth
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Health report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineHealthReport" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines/{id}/health-events:
    get:
      tags: [telecom]
      summary: Engine health-event history (platform)
      description: >-
        The append-only history of this engine's honest health-status transitions
        (a new event is recorded only when the status actually changes). Newest
        first, cursor-paginated. Each event carries the from/to status, a safe
        reason (never secrets or raw provider errors) and a correlation id. A
        foreign/unknown engine id is 404. Requires PLATFORM + `telecom.health.read`.
      operationId: listEngineHealthEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid }, description: "nextCursor from a prior page." }
      responses:
        "200":
          description: Health events (newest first)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEventPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines/{id}/config-versions:
    get:
      tags: [telecom]
      summary: Engine config-version history (platform)
      description: >-
        The append-only history of this engine's desired/applied configuration
        versions (recorded by sync / rollback). Newest first, cursor-paginated.
        Each entry carries the change type, the version snapshot's kind and short
        fingerprint, a resource-count summary, the prior version's short
        fingerprint, and the actor + correlation id. Snapshots are secret-free (no
        credentials). A foreign/unknown engine id is 404. Requires PLATFORM +
        `telecom.health.read`.
      operationId: listEngineConfigVersions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid }, description: "nextCursor from a prior page." }
      responses:
        "200":
          description: Config versions (newest first)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigVersionPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/telecom/engines/{id}/sync:
    post:
      tags: [telecom]
      summary: Synchronize control-plane config to the engine (platform)
